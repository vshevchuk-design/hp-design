<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Springboard</title>
<link rel="stylesheet" href="../../assets/fonts/sora/sora.css" />
<style>
:root {
  --tok-surface-page: #ffffff;
  --tok-text-secondary: #696969;
  --tok-bg-neutral: #e8e8e8;
  --tok-family-sans: 'Sora', sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--tok-surface-page); font-family: var(--tok-family-sans); }

.empty-state { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: var(--tok-family-sans); }
.empty-state__text { background: var(--tok-bg-neutral); color: var(--tok-text-secondary); border-radius: 999px; padding: 8px 16px; font-weight: 400; font-size: 14px; line-height: 1.4; text-align: center; }
</style>
</head>
<body>
<div class="empty-state"><span class="empty-state__text">Springboard — layout not designed yet</span></div>
</body>
</html>
