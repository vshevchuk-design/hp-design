<!--
PAGE: History
FOR: student (signed in; sees only their own records)
PURPOSE: Lets a student look back at what their advisors recorded about them (notes, action items, past appointments) and open any note or appointment in full.
URL: ?q=<text> (Notes search), ?tab=summaries|noshows|cancellations (selected Appointments tab), ?note=<id> / ?appointment=<id> (the open record; Copy note link copies the ?note= one). Page numbers, rows per page, the sort order and collapsed sections are not kept in the URL.
KNOWN BEFORE LOAD: whose history it is comes from the signed-in user (the student) — never from the address. From the address: the search text, the Appointments tab, and which record to open on arrival (?note= / ?appointment=; if that id isn't one of this student's records, the page loads normally and the Sheet shows "Record not found").
DATA:
  - Signed-in student: whose records to show; name + initials for the student's own Avatar ("You" in Booked by). Source: the sign-in session.
  - Notes (list): category, subject, author name + department, created date/time. Source: not known yet.
  - Note (opened): full text, attachments (file name, type, size, download link), topics. Source: not known yet.
  - Action items: type, author name + department, created date/time, comment (full text, shown in the list). Source: not known yet.
  - Appointments (list): past appointments in three groups (Summaries, No Shows, Cancellations): department, appointment type, department member, booked by, created on; for Cancellations also the cancellation reason. Source: not known yet.
  - Appointment (opened): summary / no-show note / cancellation reason (may be empty), summary attachments, the student's reason for visit, topics. Source: not known yet.
  - Each list comes with its total count (shown next to the section title and on each tab).
  - People's photos for the Avatars (advisors, authors, bookers, the student); initials when there is no photo. Source: not known yet.
  - Whether each advisor can receive a message (hides Message advisor — see OPEN QUESTIONS 3) and whether an appointment type can still be booked (hides Book again). Source: not known yet.
ACTIONS:
  - Search notes by text.
  - Collapse / expand each section.
  - Switch the Appointments tab (Summaries, No Shows, Cancellations).
  - Sort each table by a column (click the header; again to flip the order).
  - Change rows per page (5, 10, 20) and page through each list on its own.
  - Open a note or an appointment: a Sheet (side panel) on this page shows the full record. Action items are not opened; the list shows the whole comment.
  - In the Sheet: download an attachment; Copy note link (notes only); Message advisor (opens Message Center, another page); Book again (appointments only, opens Scheduling, another page — designer's proposal).
  - Nothing on this page saves or sends anything, and nothing saves automatically.
ITEMS:
  - Note row — Table row (768px+) or a card (below 768px): created date + time, subject (cut after 2 lines with …), category Badge (amber tint, the same for any category), Avatar + author name over department (one line each, cut with …). View / tapping the card opens the note. No messages of its own.
  - Action item row — Table row or card: created date + time, type, Avatar + author over department, the comment in full. Not openable. No messages of its own.
  - Appointment row — Table row or card: type (+ the cancellation reason on Cancellations), Avatar + department member over the appointment's department (one line each, cut with …), Avatar + booked by ("You" when the student booked it), created date + time. View / tapping the card opens the appointment.
  - Attachment (in the Sheet) — one per file: file icon, file name (one line, cut with …), type · size, download. Failure message: see the Attachment note.
  - Topic (in the Sheet) — a neutral pill with the topic name; the Topics row is hidden when there are none.
  - Details row (in the Sheet) — label + value; a row with no value is hidden, never shown as "—".
  - Record text (in the Sheet) — any length, line breaks kept; when an appointment has no text, one grey line replaces the section (text in the Sheet's rule note).
OPEN QUESTIONS:
  1. Does ui-next Table have a stacked layout for phone width? Below 768px this mockup shows each row as a card; if Table can't, which component should the cards be?
  2. What does Notes search match: subject, category, author, the note text?
  3. When is "Message advisor" hidden? In the current build some appointments have no Send Message button (e.g. an advisor who may have left). Which advisors can't be messaged, and should the button be hidden or disabled with a reason?
  4. Data sources (for the developers): where notes, action items, appointments, people's photos, the "advisor can receive messages" flag and the "type can still be booked" flag come from — every DATA line says "Source: not known yet".
  5. Avatar and Attachment are not in the guide's ui-next list. They are used on the live History page, but their exact ui-next names and settings weren't checked (the Storybook needs a sign-in). Please confirm.
  6. "Record not found" needs no "Try again" (retrying can't help). Can ErrorState be shown without its button? If not, show the same title and message as plain Text in the Sheet body instead.
STATES NOT SHOWN: "Error saving" — nothing on this page saves; the only things that can fail after load are a download and copying a link, shown as "Download failed". "One section failed" (not needed for now; if one list fails the whole page shows Error loading). Other user types — only students use this page, so there is one view.
-->
<!--
STATES (switcher order):
  Default: normal data.
  Loading: first load; every list shows skeleton rows, counts show "–", pagination hidden.
  Empty: a new student with no records; each section stays and shows its own EmptyState.
  No search results: Notes search matched nothing; the other sections are unaffected.
  Error loading: the history couldn't load (first load, or a later page / tab / search request failed); one ErrorState replaces the three sections.
  Many rows: 50+ items in every list (56 notes, 52 action items; 54 summaries, 51 no-shows, 53 cancellations) with long titles, names, departments and cancellation reasons; pagination shortens with "…".
  Record open: the Sheet for a note with attachments and topics.
  Long note / Long summary: a note and an appointment summary much taller than the panel; the text scrolls under the pinned Details.
  Record loading: the Sheet while the full record is being read.
  Record error: the Sheet when the full record couldn't be read; it offers to try again.
  Record not found: the address has ?note= / ?appointment= with an id that isn't this student's (an old or someone else's link); the page loads, the Sheet says so, with no retry.
  Record without actions: an appointment with no footer — its advisor can't be messaged and its type can't be booked any more.
  Download failed: an attachment couldn't download; a toast says so (text in the Attachment note).
-->
<!-- ui-next: SkeletonLine | 3 lines per list while it loads, and in the Sheet body while a record loads; used on their own, not inside LoadingState -->
<!-- rule (all three lists): while a list loads it shows 3 SkeletonLine rows on their own (no LoadingState around them); with no records it shows an EmptyState: one short line on a grey pill, centred, no icon, no heading — each list's text is in its own note -->

<title>History — mockup</title>

<style>
/* Mockup styling only — developers use ui-next components, not this CSS.
   Values are copied from the HighPoint design system (hp-design tokens, History v4 page), not new ones. */
:root {
  --page: #f9fafb; --surface: #ffffff; --surface-dim: #f4f5f7; --surface-dim-hover: #e6e8eb; --sunken: #e6e8eb;
  --border: #dadde0; --border-strong: #adb5be; --text: #121921; --text-2: #5d6a7a; --text-muted: #758191; --text-disabled: #adb5be;
  --icon: #485462; --icon-2: #758191; --primary: #077fec; --primary-hover: #0468c4; --primary-text: #0468c4;
  --primary-tint: #d9eaff; --primary-tint-hover: #c7dffc; --focus: #0468c4;
  --neutral-hover: #e6e8eb; --counter-bg: #cdd1d6; --counter-text: #485462;
  --amber-bg: #ffe2c5; --amber-text: #935a03; --amber-50: #fff3e7;
  --danger-bg: #ffdfde; --danger-border: #febebd; --danger-text: #c11435;
  --overlay: rgba(21, 25, 30, 0.5); --radius: 8px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: "Sora", system-ui, sans-serif; font-size: 14px; line-height: 1.4; color: var(--text); background: var(--page); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; }

/* mockup-only state switcher */
.mk { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; background: #242c36; color: #fff; font-size: 12px; line-height: 16px; }
.mk b { margin-right: 4px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #d9eaff; }
.mk button { padding: 4px 12px; border: 1px solid #485462; border-radius: 999px; background: transparent; color: #fff; font-size: 12px; cursor: pointer; }
.mk button[aria-pressed="true"] { background: #fff; color: #121921; border-color: #fff; }

/* TopBar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
.topbar h1 { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 600; }
.wrap { container-type: inline-size; max-width: 1280px; margin: 0 auto; padding: 32px 32px 48px; display: flex; flex-direction: column; gap: 24px; }

/* CollapsiblePanel (flush Card) */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.panel__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); }
.panel--tabs .panel__head { border-bottom: none; padding-bottom: 8px; }
.panel.is-collapsed .panel__head { border-bottom: none; padding-bottom: 16px; }
.panel.is-collapsed .panel__body, .panel.is-collapsed .field-inline { display: none; }
.panel__title { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 4px; font-weight: 600; }
.toggle svg { color: var(--icon-2); transition: transform .15s; }
.toggle:hover svg { color: var(--icon); }
.toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
/* CountBadge (DS Counter) */
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--counter-bg); color: var(--counter-text); font-size: 10px; line-height: 1; font-weight: 700; }

/* Field with inline label + SearchField (DS Search sm) */
.field-inline { display: flex; align-items: center; gap: 8px; }
.field-inline label { font-size: 14px; color: var(--text-2); white-space: nowrap; }
.search { display: flex; align-items: center; gap: 8px; width: 280px; max-width: 100%; height: 32px; padding: 0 12px; background: var(--surface-dim); border: 1px solid var(--border); border-radius: var(--radius); }
.search:hover { background: var(--surface-dim-hover); border-color: var(--border-strong); }
.search:focus-within { border-color: var(--focus); }
.search__icon { color: var(--icon); }
.search input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: var(--text); }
.search input::placeholder { color: var(--text-muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { display: none; width: 20px; height: 20px; padding: 0; border: 0; background: none; color: var(--icon); cursor: pointer; border-radius: var(--radius); }
.search.has-value .clear { display: inline-flex; }

/* Tabs (underline) */
.tabs { display: flex; padding: 0 16px 0 32px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 2px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--text-2); font-size: 14px; font-weight: 400; white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--text); }
.tabs:not(.is-end) { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--primary); }
.tab[aria-selected="true"] .count { background: var(--primary); color: #fff; }

/* Table */
table { width: 100%; border-collapse: collapse; }
th { padding: 12px 16px; text-align: left; font-size: 12px; line-height: 1.4; font-weight: 700; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px 16px; vertical-align: top; border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-dim); }
th + th, td + td { padding-left: 16px; }
.sorth { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-transform: inherit; cursor: pointer; border-radius: 4px; }
.sorth svg { width: 14px; height: 14px; opacity: .4; transition: transform .12s ease, opacity .12s ease; }
.sorth:hover svg { opacity: .7; }
.sorth:focus-visible { outline: 2px solid #0468c4; outline-offset: 2px; }
th[aria-sort] .sorth { color: var(--text); }
th[aria-sort] .sorth svg { opacity: 1; color: #0468c4; }
th[aria-sort="ascending"] .sorth svg { transform: rotate(180deg); }
.t-title { font-size: 14px; line-height: 1.4; font-weight: 600; }
.sub { display: block; color: var(--text-2); }
.date { white-space: nowrap; color: var(--text-2); }
.date .sub { color: var(--text-2); }
.col-act { width: 72px; text-align: right; }
.person { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 280px; }
.person__text { display: flex; flex-direction: column; min-width: 0; }
.person__name, .person__sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person__sub { color: var(--text-muted); }
.avatar { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; font-size: 12px; line-height: 1; font-weight: 600; user-select: none; }
.avatar--blue { background: #d9eaff; color: #0468c4; } .avatar--green { background: #d4f1da; color: #057e3f; }
.avatar--magenta { background: #ffddec; color: #b51c79; } .avatar--amber { background: #ffe2c5; color: #935a03; }
.avatar--teal { background: #cfefef; color: #057878; } .avatar--orange { background: #ffe1d5; color: #ae4103; }
.avatar--violet { background: #e8e4ff; color: #743ed8; } .avatar--red { background: #ffdfde; color: #c11435; }
.fact { display: flex; gap: 8px; color: var(--text-2); }
.fact svg { width: 16px; height: 16px; margin-top: 2px; color: var(--icon-2); }
.fact span span { display: block; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--amber-bg); color: var(--amber-text); font-size: 12px; line-height: 1; font-weight: 400; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: var(--radius); background: var(--primary-tint); color: var(--primary-text); font-size: 12px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--primary-tint-hover); }
.btn--primary { background: var(--primary); color: #fff; height: 40px; padding: 0 16px; font-size: 14px; }
.btn--primary:hover { background: var(--primary-hover); }
.clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.reason { display: block; margin-top: 4px; color: var(--text-2); }

/* Phone cards (below 768px) */
.cards { display: none; list-style: none; margin: 0; padding: 0; }
.card { position: relative; display: flex; gap: 12px; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
.cards li:last-child .card { border-bottom: none; }
.card__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.card__date { font-size: 12px; line-height: 1.4; color: var(--text-2); }
.card__title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; line-height: 1.4; font-weight: 600; }
.card__person { margin-top: 4px; font-size: 12px; line-height: 1.4; }
.card__person .person { max-width: 100%; }
.card__person .person__name { color: var(--text); }
.card__fact { font-size: 12px; line-height: 1.4; color: var(--text-2); }
.card__comment { margin-top: 4px; padding: 8px 12px; border-radius: var(--radius); background: var(--amber-50); }
.card > svg { color: var(--icon-2); }
.card__open { position: absolute; inset: 0; border: 0; background: none; cursor: pointer; border-radius: 0; }
.card__open:focus-visible { outline-offset: -2px; }
.card:has(.card__open):hover { background: var(--surface-dim); }

/* TablePaginationControl (DS rows-per-page Select sm + Pagination) */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 12px 16px; border-top: 1px solid var(--border); }
.rpp { position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.select { display: flex; align-items: center; gap: 8px; width: 72px; height: 32px; padding: 0 8px; background: var(--surface-dim); border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; color: var(--text); text-align: left; cursor: pointer; }
.select:hover { background: var(--surface-dim-hover); border-color: var(--border-strong); }
.select:focus-visible { outline: none; border-color: var(--focus); }
.select[aria-expanded="true"] { border-color: var(--focus); }
.select span { flex: 1; }
.select svg { width: 16px; height: 16px; color: var(--icon); transition: transform .12s; }
.select[aria-expanded="true"] svg { transform: rotate(180deg); }
.listbox { position: absolute; bottom: calc(100% + 4px); right: 0; z-index: 20; min-width: 72px; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 2px 8px rgba(21, 25, 30, 0.1); }
.listbox button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px; border: 0; border-radius: 4px; background: none; font-size: 14px; color: var(--text); cursor: pointer; text-align: left; }
.listbox button:hover { background: var(--neutral-hover); }
.listbox svg { width: 16px; height: 16px; color: var(--primary); visibility: hidden; }
.listbox [aria-selected="true"] svg { visibility: visible; }
.pager { display: flex; align-items: center; gap: 12px; }
.range { font-size: 12px; color: var(--text-muted); }
.pages { display: inline-flex; align-items: center; gap: 4px; }
.pages button { min-width: 32px; height: 32px; padding: 0 6px; border: 0; border-radius: var(--radius); background: none; font-size: 14px; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.pages button svg { width: 20px; height: 20px; }
.pages button:hover:not(:disabled):not([aria-current]) { background: var(--neutral-hover); }
.pages button[aria-current="page"] { background: var(--primary); color: #fff; }
.pages button:disabled { color: var(--text-disabled); cursor: default; }
.pages .gap { min-width: 24px; text-align: center; color: var(--text-muted); }

/* EmptyState (DS: text on a long grey pill) */
.empty { display: flex; justify-content: center; padding: 24px; }
.empty__text { padding: 8px 16px; border-radius: 999px; background: #e6e8eb; color: var(--text-2); font-size: 14px; line-height: 1.4; text-align: center; }
/* ErrorState / LoadingState */
.state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 16px; text-align: center; }
.state svg { width: 32px; height: 32px; color: var(--icon-2); }
.state h2, .state h3 { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; }
.state p { margin: 0; color: var(--text-2); max-width: 400px; }
.state .btn { margin-top: 8px; }
.state--error svg { color: var(--danger-text); }
.btn--secondary { height: 40px; padding: 0 16px; font-size: 14px; }
.sheet-sk { display: flex; flex-direction: column; gap: 12px; }
.sheet-sk .sk:nth-child(3n) { width: 60%; }
.sk { display: block; height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--sunken) 0%, var(--surface-dim) 50%, var(--sunken) 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .toggle svg, .select svg { transition: none; } }
.sk-row { display: grid; grid-template-columns: 1fr 2fr 1fr 1.5fr; gap: 16px; padding: 18px 16px; border-bottom: 1px solid var(--border); }

/* Sheet (right side panel) */
.sheet { position: fixed; inset: 0; z-index: 40; display: none; }
.sheet.is-open { display: block; }
.sheet__scrim { position: absolute; inset: 0; background: var(--overlay); }
.sheet__panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 100%); display: flex; flex-direction: column; background: var(--surface); box-shadow: -8px 0 24px rgba(0,0,0,.12); }
.sheet__head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.sheet__heading { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.sheet__head h2 { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 600; }
.sheet__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; font-size: 12px; line-height: 1.4; color: var(--text-muted); }
.badge--neutral { background: #e6e8eb; color: var(--text-2); }
.badge--success { background: #d4f1da; color: #057e3f; }
.sheet__dept { color: var(--text-2); font-size: 14px; }
.sheet__close { padding: 6px; border: 0; background: none; border-radius: var(--radius); color: var(--icon); cursor: pointer; display: inline-flex; }
.sheet__close:hover { background: var(--neutral-hover); }
.sheet__body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
.sheet__text { white-space: pre-line; }
.sheet__none { margin: 0; color: var(--text-muted); }
.sec__label { margin: 0 0 8px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-2); }
.sheet__details { flex-shrink: 0; max-height: 45%; overflow-y: auto; padding: 16px 24px 24px; border-top: 1px solid var(--border); }
.sheet__details:empty { display: none; }
.sheet__body { min-height: 0; overscroll-behavior: contain; }
.sheet__body > * { flex-shrink: 0; }
.sheet__details { overscroll-behavior: contain; }
html.sheet-open, html.sheet-open body { overflow: hidden; }
.dl { display: grid; grid-template-columns: 144px minmax(0, 1fr); gap: 12px 16px; align-items: center; margin: 0; }
.dl dt { color: var(--text-muted); }
.dl dd { margin: 0; min-width: 0; }
.dl dd .person { max-width: 100%; }
.sheet__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--border); }
.sheet__foot[hidden] { display: none; }
.sheet__foot .btn { white-space: nowrap; }
@media (max-width: 479px) { .sheet__foot { padding: 16px; } .sheet__foot { flex-wrap: wrap-reverse; } .sheet__foot .btn { flex: 1 1 auto; padding: 0 12px; } #copy-link svg { display: none; } .sheet__foot .btn[hidden] { display: none; } .sheet__head, .sheet__body { padding-left: 16px; padding-right: 16px; } .dl { grid-template-columns: 96px minmax(0, 1fr); } }
.btn--outline { height: 40px; padding: 0 16px; font-size: 14px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); }
.btn--outline:hover { background: var(--neutral-hover); }
.btn--outline svg { color: var(--icon-2); }
.sheet__foot .btn--primary svg { color: #fff; }
.files { display: flex; flex-direction: column; gap: 8px; }
.attachment { display: flex; align-items: center; gap: 8px; max-width: 320px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-dim); color: inherit; text-decoration: none; }
.attachment:hover { border-color: var(--primary); }
.attachment__media { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--radius); background: var(--surface); }
.attachment__media svg { color: var(--icon-2); }
.attachment__content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.attachment__title, .attachment__desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment__title { font-size: 12px; line-height: 1.2; font-weight: 600; }
.attachment__desc { font-size: 10px; line-height: 1.2; color: var(--text-muted); }
.attachment__action { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--radius); color: var(--icon-2); }
.attachment__action svg { width: 16px; height: 16px; }
.attachment:hover .attachment__action { background: var(--neutral-hover); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.pills li { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; background: #e6e8eb; color: var(--text-2); font-size: 12px; }
.btn svg { width: 16px; height: 16px; }
a.btn { text-decoration: none; }
.search.is-disabled { opacity: .5; pointer-events: none; }
.toast { position: fixed; left: 50%; top: 24px; width: max-content; max-width: calc(100% - 32px); text-align: center; z-index: 60; transform: translateX(-50%); padding: 12px 16px; border-radius: var(--radius); background: #242c36; color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .15s; }
.toast.is-on { opacity: 1; }

.sheet__body p { margin: 0; }

/* Phone / narrow */
@container (min-width: 560px) and (max-width: 767px) {
  .card__main { display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 16px; row-gap: 4px; align-items: start; }
  .card__main > * { grid-column: 2; }
  .card__main > .card__date { grid-column: 1; grid-row: 1 / span 4; display: flex; flex-direction: column; font-size: 14px; }
  .card__sep { display: none; }
}
@container (max-width: 767px) {
  .tablewrap { display: none; }
  .cards { display: block; }
  .sk-row { grid-template-columns: 1fr; gap: 8px; }
}
@media (max-width: 767px) {
  .topbar { padding: 0 16px; }
  .wrap { padding: 16px 0; gap: 16px; }
  .panel { border-left: 0; border-right: 0; border-radius: 0; }
  .field-inline { width: 100%; }
  .search { width: 100%; }
  .tabs { padding-left: 16px; }
  .foot { justify-content: center; }
}
/* Settings — the global header button: Button outline base icon-only + DropdownMenu "Preferences" (same on every page) */
.prefs { position: relative; display: inline-flex; flex-shrink: 0; }
.settings-btn { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; width: 40px; height: 40px; padding: 0; border: 1px solid #dadde0; border-radius: 8px; background: transparent; color: #485462; cursor: pointer; }
.settings-btn svg { width: 20px; height: 20px; fill: currentColor; }
.settings-btn:hover, .settings-btn[aria-expanded="true"] { background: #e6e8eb; }
.settings-btn:active { background: #cdd1d6; }
.prefs-menu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 55; min-width: 200px; padding: 4px; background: #fff; border: 1px solid #dadde0; border-radius: 8px; box-shadow: 0 2px 8px rgba(21, 25, 30, 0.10); text-align: left; }
.prefs-menu__label { display: flex; align-items: center; height: 28px; padding: 0 8px; color: #758191; font-size: 12px; font-weight: 600; line-height: 1.4; }
.prefs-menu__item { display: flex; align-items: center; height: 36px; padding: 0 8px; border-radius: 4px; color: #121921; font-size: 14px; font-weight: 400; text-decoration: none; }
.prefs-menu__item:hover, .prefs-menu__item:focus-visible { background: #e6e8eb; outline: none; text-decoration: none; }
</style>
</head>
<body>

<!-- mockup-only: state switcher, do not build -->
<div class="mk" role="toolbar" aria-label="Mockup states">
  <b>Mockup state</b>
  <button type="button" data-state="default" aria-pressed="true">Default</button>
  <button type="button" data-state="loading" aria-pressed="false">Loading</button>
  <button type="button" data-state="empty" aria-pressed="false">Empty</button>
  <button type="button" data-state="nosearch" aria-pressed="false">No search results</button>
  <button type="button" data-state="error" aria-pressed="false">Error loading</button>
  <button type="button" data-state="many" aria-pressed="false">Many rows</button>
  <button type="button" data-state="sheet" aria-pressed="false">Record open</button>
  <button type="button" data-state="sheetlong" aria-pressed="false">Long note</button>
  <button type="button" data-state="sheetlongappt" aria-pressed="false">Long summary</button>
  <button type="button" data-state="sheetload" aria-pressed="false">Record loading</button>
  <button type="button" data-state="sheeterr" aria-pressed="false">Record error</button>
  <button type="button" data-state="sheetnf" aria-pressed="false">Record not found</button>
  <button type="button" data-state="sheetnoact" aria-pressed="false">Record without actions</button>
  <button type="button" data-state="dlfail" aria-pressed="false">Download failed</button>
</div>

<!-- ui-next: TopBar -->
<!-- data: page title "History"; on the right the app's global Settings button (the same on every page) -->
<!-- phone: below 768px the bar's side padding drops from 24px to 16px -->
<header class="topbar">
  <!-- ui-next: Text | as="h1" -->
  <h1>History</h1>
  <!-- ui-next: IconButton | variant="outline", size="base", icon settings, aria-label "Settings" — the app's global header button, drawn the same on every page -->
  <!-- ui-next: DropdownMenu | opens under the button, right-aligned; a group label "Preferences", then two items: "Institutions", "About" -->
  <!-- action: part of the app's global header, not tied to this page: each item opens that app page (Institutions, About); nothing on this page changes -->
  <!-- phone: the same below 768px -->
  <span class="prefs"><button class="settings-btn" type="button" aria-label="Settings" aria-haspopup="menu" aria-expanded="false" id="prefs-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button><div class="prefs-menu" id="prefs-menu" role="menu" aria-label="Preferences" hidden><div class="prefs-menu__label">Preferences</div><a class="prefs-menu__item" role="menuitem" href="#institutions">Institutions</a><a class="prefs-menu__item" role="menuitem" href="#about">About</a></div></span>
</header>

<main class="wrap" id="main">

  <!-- ui-next: ErrorState | title "We couldn't load your history", message "Something went wrong on our side. Your records are safe — try again in a moment.", onRetry = request all three lists again (the Loading state shows while it waits; if it fails again, this ErrorState comes back) -->
  <!-- state: "Error loading": the history couldn't load. Replaces all three sections. -->
  <!-- rule: also shown when a later request fails (a new page, rows per page, a tab, a search): one failure anywhere replaces the whole page, see STATES NOT SHOWN -->
  <!-- phone: below 768px it runs edge to edge like the sections (no side borders, no rounded corners) -->
  <div id="page-error" hidden>
    <div class="panel"><div class="state state--error">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg>
      <h2>We couldn't load your history</h2>
      <p>Something went wrong on our side. Your records are safe — try again in a moment.</p>
      <button class="btn btn--primary" type="button" id="retry">Try again</button>
    </div></div>
  </div>

  <!-- ui-next: CollapsiblePanel | header = title + CountBadge + SearchField -->
  <!-- data: notes for the signed-in student, newest first; CountBadge = total notes (not the filtered count) -->
  <!-- action: clicking the title collapses / expands the section; nothing is saved -->
  <!-- rule: all three sections are open on every visit — collapsing is not remembered. All three are always shown, also when empty; only the student whose history it is can see it -->
  <!-- phone (all three sections): below 768px a section loses its side borders and rounded corners and runs edge to edge, with 16px between sections -->
  <section class="panel" id="notes" aria-labelledby="notes-title">
    <div class="panel__head">
      <h2 class="panel__title" id="notes-title">
        <button class="toggle" type="button" aria-expanded="true" aria-controls="notes-body"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>Notes</button>
        <!-- ui-next: CountBadge -->
        <!-- state: "Loading": shows "–" until the counts arrive (same on the other two sections and on the tabs) -->
        <span class="count" data-count="notes"></span>
      </h2>
      <!-- ui-next: SearchField | small (same height as the section's buttons), placeholder "Search notes", accessible label "Search notes" (not shown) -->
      <!-- rule: no visible label on purpose: a search field with the search icon in a section header is the agreed exception to "every input has a visible label" -->
      <!-- data: search text, kept in the URL as ?q= -->
      <!-- action: filters the Notes list as the user types; the X clears it and shows all notes; any change goes back to page 1 and updates ?q= -->
      <!-- action: the request failing → page ErrorState (Error loading) -->
      <!-- rule: optional, any text; no minimum length (see OPEN QUESTIONS 2 for what it matches) -->
      <!-- rule: hidden while the section is collapsed -->
      <!-- state: "Loading": the field is shown but disabled until the notes have loaded; on "Error loading" it goes away with the sections -->
      <!-- phone: below 768px the field moves under the section title and goes full width -->
      <div class="field-inline" id="notes-field">
      <label for="notes-q" class="vh">Search notes</label>
      <div class="search" id="notes-search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="search" id="notes-q" placeholder="Search notes" autocomplete="off" />
        <button class="clear" type="button" aria-label="Clear search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      </div>
    </div>
    <div class="panel__body" id="notes-body">
      <!-- ui-next: Table | columns: Date · Subject · Category · Created by · (View); each of the four named columns has a SortHeader -->
      <!-- ui-next: SortHeader | on Date, Subject, Category, Created by (sorts by the author's name) -->
      <!-- action (sorting, all three tables): clicking a header sorts the whole list by that column (not just the visible page) and goes back to page 1; clicking it again flips the order. A date column starts newest first, a text column starts A→Z. One column at a time; the active one shows its arrow in blue, the others a faint arrow. Default: Date (Created on in Appointments), newest first. Not kept in the URL and not remembered; the search and the Appointments tab keep the chosen sort. Nothing is saved. While the sorted list loads it shows SkeletonLine rows; if the request fails → page ErrorState (Error loading). -->
      <!-- phone (sorting): cards have no headers, so below 768px the list can't be re-sorted and shows the default order (newest first) — or the order picked on a wider screen -->
      <!-- data: per row — created date ("Tuesday, December 3, 2024" over "8:54 AM"), subject, category, author name over author department -->
      <!-- state: "Loading": 3 SkeletonLine rows instead of the table / cards. "Many rows": long subjects cut after 2 lines, long names and departments cut to one line -->
      <!-- state: no notes → EmptyState "No notes yet"; a search with no match → EmptyState "No notes match “<search text>”" -->
      <!-- rule: the note text is NOT shown in the list; View opens it -->
      <!-- rule: Created by: name and department each stay on one line; a long one is cut with "…" (the full department in a Tooltip on hover/focus) -->
      <!-- rule: a long subject is cut after 2 lines with "…" (table and cards); the full subject is the Sheet title -->
      <!-- phone (all three lists; widths are of the content area, not the window): 768px and wider = table. Tablet, 560–767px: each row becomes a card — a 112px column on the left with the date over the time, and the rest of the row stacked on the right. Phone, below 560px: the same card with the date and time on one line on top ("Oct 22, 2026 · 12:12 PM"). See OPEN QUESTIONS 1. -->
      <!-- phone (Notes card): subject + category Badge, then Avatar + author over department; a chevron on the right; tapping anywhere on the card opens the note (there is no View button) -->
            <!-- ui-next: none | not in the guide's list, but ui-next has it — use the Avatar already on the live History page: Avatar (32px circle; the person's photo when they have one, otherwise their initials; background colour picked from the name, so the same person always gets the same colour; on this page only blue, green, magenta, teal, violet — never amber/orange (clashes with the amber category Badge) or red (reads as an error); decorative, aria-hidden). Shown before the author name in the Created by column on desktop; phone and tablet cards show it too (name over department, one line each, cut with …) -->
      <!-- ui-next: Badge | tone="amber", appearance="tint", size="sm" -->
      <!-- data: the note's category, whatever it is; every category gets the same amber Badge -->
      <!-- ui-next: Button | variant="tint" size="sm" (light blue fill), label "View", accessible name "View note: <subject>" -->
      <!-- action: opens the Sheet for that note and adds ?note=<id> to the address; closing the Sheet removes it -->
      <div class="list" data-list="notes"></div>
      <!-- ui-next: TablePaginationControl | rows per page 5 / 10 / 20 (default 5), range "1–5 of 15", page buttons -->
      <!-- phone (all three lists): below 768px rows per page and the page buttons are centred and wrap onto two lines when they don't fit -->
      <!-- action: changing rows per page goes back to page 1; a page button loads that page. Each list pages on its own. Not saved; a fresh visit starts at 5 rows, page 1. While a page loads the list shows SkeletonLine rows; failing → page ErrorState -->
      <!-- rule: page buttons are hidden when everything fits on one page; the control is hidden when the list is empty -->
      <!-- state: "Loading" and "Empty": the whole control is hidden. "Many rows": the page buttons shorten to the first two, the pages around the current one and the last two, with "…" between (1 2 … 10 11) -->
      <div class="foot" data-foot="notes"></div>
    </div>
  </section>

  <!-- ui-next: CollapsiblePanel | title + CountBadge -->
  <!-- data: action items for the student, newest first; CountBadge = total -->
  <section class="panel" id="actions" aria-labelledby="actions-title">
    <div class="panel__head">
      <h2 class="panel__title" id="actions-title">
        <button class="toggle" type="button" aria-expanded="true" aria-controls="actions-body"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>Action Items</button>
        <span class="count" data-count="actions"></span>
      </h2>
    </div>
    <div class="panel__body" id="actions-body">
      <!-- ui-next: Table | columns: Date · Type · Created by · Comment -->
      <!-- ui-next: SortHeader | on Date, Type, Created by; Comment is not sortable (sorting works as in Notes) -->
      <!-- data: per row — created date/time, action item type, author name over department, comment (full text) -->
      <!-- ui-next: none | Avatar from ui-next (not in the guide's list), same as in Notes -->
      <!-- state: "Loading": 3 SkeletonLine rows. "Many rows": long comments wrap in full (they are never cut) -->
      <!-- state: no action items → EmptyState "No action items" -->
      <!-- rule: list only: no View button, rows can't be opened, nothing to do with an action item here; the comment is shown in full and wraps -->
      <!-- phone (Action Items card): type, Avatar + author · department, then the comment in a light amber box (4px more space above it than between the other lines, so it sits apart from the author); the card is not tappable and has no chevron -->
      <div class="list" data-list="actions"></div>
      <!-- ui-next: TablePaginationControl | same as Notes -->
      <div class="foot" data-foot="actions"></div>
    </div>
  </section>

  <!-- ui-next: CollapsiblePanel | title + CountBadge (total of all three tabs) -->
  <!-- data: past appointments for the student, newest first, in three groups -->
  <section class="panel panel--tabs" id="appts" aria-labelledby="appts-title">
    <div class="panel__head">
      <h2 class="panel__title" id="appts-title">
        <button class="toggle" type="button" aria-expanded="true" aria-controls="appts-body"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>Appointments</button>
        <span class="count" data-count="appts"></span>
      </h2>
    </div>
    <div class="panel__body" id="appts-body">
      <!-- ui-next: Tabs | underline style; each tab has a CountBadge -->
      <!-- data: selected tab, kept in the URL as ?tab= -->
      <!-- action: switches the list below; resets Appointments to page 1 and updates ?tab=; the list shows SkeletonLine rows while it loads; failing → page ErrorState -->
      <!-- phone: below 768px the tab row starts 16px from the screen edge (the section has no side border then); when the tabs don't fit they keep their size and scroll sideways; a fade on the right edge shows there is more, and goes away once scrolled to the end -->
      <div class="tabs" role="tablist" aria-label="Appointments">
        <button class="tab" role="tab" type="button" aria-selected="true" data-tab="summaries">Summaries <span class="count" data-count="summaries"></span></button>
        <button class="tab" role="tab" type="button" aria-selected="false" data-tab="noshows">No Shows <span class="count" data-count="noshows"></span></button>
        <button class="tab" role="tab" type="button" aria-selected="false" data-tab="cancellations">Cancellations <span class="count" data-count="cancellations"></span></button>
      </div>
      <!-- ui-next: Table | columns: Type · Department member · Booked by · Created on · (View) — no Department column: the department is the grey line under the department member -->
      <!-- ui-next: SortHeader | on all four named columns; default Created on, newest first (sorting works as in Notes); switching tabs keeps the sort -->
      <!-- data: per row — appointment type, department member (the advisor the meeting was with) over the appointment's department, who booked it ("You" when the student booked it), created date/time -->
      <!-- rule: the grey line under the department member is the APPOINTMENT's department (where the meeting was), not the advisor's home department; it reads as "with Alexander Robinson, Academic Advising". One line, cut with "…", full text in a Tooltip -->
      <!-- state: "Loading": 3 SkeletonLine rows. "Many rows": long names and departments cut to one line; a long cancellation reason wraps under the type -->
      <!-- state: per tab, no rows → EmptyState "No appointment summaries" / "No missed appointments" / "No cancelled appointments" -->
      <!-- ui-next: none | Avatar from ui-next (not in the guide's list), same as in Notes; before the Department member (name over department) and Booked by (name only, no department line) names; "You" gets the student's own Avatar -->
      <!-- rule: Cancellations tab shows the cancellation reason as a quiet line under the type -->
      <!-- ui-next: Button | variant="tint" size="sm" (light blue fill), label "View", accessible name "View <type> appointment, <date>" -->
      <!-- action: opens the Sheet for that appointment and adds ?appointment=<id> to the address; closing the Sheet removes it -->
      <!-- phone (Appointments card): type (+ the cancellation reason on Cancellations), then Avatar + department member over department; a chevron on the right; tapping the card opens the appointment -->
      <div class="list" data-list="appts"></div>
      <!-- ui-next: TablePaginationControl | same as Notes; switching tabs goes back to page 1 -->
      <div class="foot" data-foot="appts"></div>
    </div>
  </section>
</main>

<!-- ui-next: Sheet | opens from the right, 480px wide; header = title + Badge + close IconButton; body = sections; footer = the actions below (the Sheet's own footer, not a separate component) -->
<!-- data: note: subject (title), category (amber Badge, the same as in the list), full text, attachments (0..n: file name, type, size), topics (0..n), author name + department, created date + time with time zone. Appointment: type (title), status (Completed / No show / Cancelled — read from the record itself, so it also works when the appointment is opened from a link), department, the summary / no-show note / cancellation reason, summary attachments (0..n), the student's reason for visit (optional), department member, booked by, created on, topics (0..n). -->
<!-- rule: an appointment can have no text at all (no-shows often don't): then the body shows one muted line "<first name> didn't add a note." instead of an empty section. Empty rows (Topics) are hidden, never shown as "—". -->
<!-- rule: body order: text section ("Note" for a note; "Summary" / "Note" / "Cancellation reason" for an appointment) → "Attachments" (only when there are files) → appointment only: "Reason for visit" (only when the student wrote one); then "Details", pinned above the footer. The date is only in Details, not in the header. -->
<!-- action: opened by View, tapping a card, or arriving with ?note= / ?appointment= in the address; closed by the X, Esc or clicking outside; focus goes back to what opened it. Read only: nothing in the Sheet saves. -->
<!-- state: "Record open": the note or appointment in full. "Long note" / "Long summary": text much taller than the panel scrolls under the pinned Details -->
<!-- state: "Record loading": SkeletonLine rows on their own in the body, footer hidden; title and Badge are already known from the list -->
<!-- state: "Record not found": the id in the address isn't one of this student's records. ErrorState in the body | title "This note isn't available" (or "This appointment isn't available"), message "The link may be out of date, or it may belong to another student. Your own notes and appointments are listed on this page.", no "Try again" (trying again can't help) — see OPEN QUESTIONS 6. Footer hidden; the Sheet title is just "Note" (or "Appointment") and there is no Badge — nothing is known about the record -->
<!-- state: "Record error": the record couldn't be read. ErrorState in the body | title "We couldn't open this note" (or "We couldn't open this appointment"), message "Something went wrong on our side. Try again in a moment.", onRetry = read the record again. Footer hidden -->
<!-- state: "Record without actions": an appointment whose advisor can't receive messages (OPEN QUESTIONS 3) and whose type can't be booked any more — both footer buttons are hidden, so the footer is hidden too and Details sit at the bottom of the panel -->
<!-- phone: below 480px the Sheet takes the whole screen width; header and body padding drop from 24px to 16px -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__head">
      <div class="sheet__heading">
        <!-- ui-next: Text | as="h2" (Sheet title; looks 18px semibold) -->
        <h2 id="sheet-title"></h2>
        <!-- ui-next: Badge | note: same as the list (tone="amber", appearance="tint", size="sm"); appointment: "Completed" tone="success", "No show" / "Cancelled" tone="neutral", appearance="tint", size="sm" — as on the Scheduling past-appointment page -->
        <!-- data: appointment only: the department, 14px text secondary, after the Badge -->

    ["Academics", "Fall Course Registration Review", "Alexander Robinson", REG, "2026-06-12T11:44", "Your fall schedule is complete and meets full-time status. The prerequisite hold on CHEM 201 has been cleared.", ["Registration"], [["Fall 2026 Schedule.pdf", "PDF · 96 KB"], ["CHEM 201 Prerequisite Waiver.pdf", "PDF · 64 KB"]]],

econd course later).\n\nWork and study balance. You told me you work about 18 hours a week at the campus bookstore. With 15 units that is a full week, so keep at least two weekday afternoons free for studying and the anatomy lab. If you pick up more hours in the fall, let me know before the add/drop deadline (September 4) and we can move HLTH 100 to spring.\n\nCampus resources we talked about:\n• The Math Success Center has drop-in tutoring for MATH 140 every weekday, 10 AM–4 PM, in Library Room 204.\n• The Writing Center can review your Health Sciences application essay — book at least two weeks before February 15.\n• Career Services runs a health careers panel on October 8; it counts as an activity for your application.\n• If money gets tight, the Basic Needs office has emergency grants up to $500; you don't need to pay them back.\n\nHealth Sciences application checklist:\n1. GPA 3.0 or higher — you have 3.4.\n2. MATH 140 and PSYC 101 finished or in progress by the deadline.\n3. 40 hours of volunteer or work experience in a health setting — you have 12 from the hospital front desk; aim for 30 more by January.\n4. A 500-word essay on why you chose health sciences.\n5. One recommendation letter from an instructor — BIOL 120 would be a good fit, so ask your instructor near the end of the term.\n\nThings to watch. If your GPA drops below 3.0 after fall, you can still apply, but the department looks at your last 30 units, so a strong spring matters. If anything changes — a class you want to drop, a family situation, a new job — message me first; there is usually a way to adjust the plan without falling behind.\n\nNext steps. Book a 30-minute check-in with me in the first two weeks of fall, bring your draft schedule, and we'll go over the application essay together in November.", ["First-Time Freshmen", "On-Track"]],

  function emptyState(text) { return '<div class="empty"><span class="empty__text">' + esc(text) + "</span></div>"; }
  function skeleton() { var r = ""; for (var i = 0; i < 3; i++) r += '<div class="sk-row"><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>'; return '<div aria-busy="true" aria-label="Loading">' + r + "</div>"; }

  function renderNotes(D) {
    var list = sorted("notes", filtered(D.notes)), p = slice("notes", list), html;
    if (S.state === "loading") html = skeleton();
    else if (!D.notes.length) html = emptyState("No notes yet");
    else if (!list.length) html = emptyState("No notes match “" + S.q.trim() + "”");
    else {
      html = '<div class="tablewrap"><table><thead><tr>' + th("notes", "date", "Date") + th("notes", "subject", "Subject") + th("notes", "category", "Category") + th("notes", "author", "Created by") + '<th class="col-act"><span class="vh">Actions</span></th></tr></thead><tbody>' +
        p.rows.map(function (n, i) { var k = "notes:" + (p.start + i); return "<tr>" + dateCell(n[4]) + '<td class="t-title"><span class="clamp2">' + esc(n[1]) + '</span></td><td><span class="badge">' + esc(n[0]) + "</span></td><td>" + person(n[2], n[3]) + '</td><td class="col-act"><button class="btn" type="button" data-open="' + k + '" aria-label="View note: ' + esc(n[1]) + '">View</button></td></tr>'; }).join("") +
        '</tbody></table></div><ul class="cards">' +
        p.rows.map(function (n, i) { var k = "notes:" + (p.start + i); return '<li><div class="card"><div class="card__main"><span class="card__date">' + dt(n[4]) + '</span><span class="card__title"><span class="clamp2">' + esc(n[1]) + '</span> <span class="badge">' + esc(n[0]) + '</span></span><span class="card__person">' + person(n[2], n[3]) + '</span></div>' + CHEV + '<button class="card__open" type="button" data-open="' + k + '" aria-label="View note: ' + esc(n[1]) + '"></button></div></li>'; }).join("") + "</ul>";
    }

  }
  function renderActions(D) {
    var p = slice("actions", sorted("actions", D.actions)), html;
    if (S.state === "loading") html = skeleton();
    else if (!D.actions.length) html = emptyState("No action items");
    else {
      html = '<div class="tablewrap"><table><colgroup><col style="width:232px"><col style="width:200px"><col style="width:240px"><col></colgroup><thead><tr>' + th("actions", "date", "Date") + th("actions", "type", "Type") + th("actions", "author", "Created by") + '<th>Comment</th></tr></thead><tbody>' +
        p.rows.map(function (a) { return "<tr>" + dateCell(a[3]) + '<td class="t-title">' + esc(a[0]) + "</td><td>" + person(a[2], a[1]) + "</td><td>" + esc(a[4]) + "</td></tr>"; }).join("") +
        '</tbody></table></div><ul class="cards">' +
        p.rows.map(function (a) { return '<li><div class="card"><div class="card__main"><span class="card__date">' + dt(a[3]) + '</span><span class="card__title">' + esc(a[0]) + '</span><span class="card__person">' + person(a[2], a[1]) + '</span><span class="card__comment">' + esc(a[4]) + "</span></div></div></li>"; }).join("") + "</ul>";
    }
    $('[data-list="actions"]').innerHTML = html;
    var c = $('[data-count="actions"]'); c.textContent = S.state === "loading" ? "–" : D.actions.length; 
    foot("actions", p, S.state === "loading" || !D.actions.length);
  }
  function renderAppts(D) {
    var list = sorted("appts", D.appts[S.tab]), p = slice("appts", list), html, total = 0;
    ["summaries", "noshows", "cancellations"].forEach(function (t) { total += D.appts[t].length; $('[data-count="' + t + '"]').textContent = S.state === "loading" ? "–" : D.appts[t].length; });
    $('[data-count="appts"]').textContent = S.state === "loading" ? "–" : total;
    var EMPTY = { summaries: ["No appointment summaries", "After you meet with an advisor, the summary of the meeting shows up here."], noshows: ["No missed appointments", "You haven't missed any appointments."], cancellations: ["No cancelled appointments", "You have no cancelled appointments."] }[S.tab];
    if (S.state === "loading") html = skeleton();
    else if (!list.length) html = emptyState(EMPTY[0]);
    else {
      html = '<div class="tablewrap"><table><thead><tr>' + th("appts", "type", "Type") + th("appts", "member", "Department member") + th("appts", "booked", "Booked by") + th("appts", "created", "Created on") + '<th class="col-act"><span class="vh">Actions</span></th></tr></thead><tbody>' +
        p.rows.map(function (a, i) { var k = S.tab + ":" + (p.start + i); return '<tr><td><span class="t-title">' + esc(a[1]) + "</span>" + (S.tab === "cancellations" ? '<span class="reason">' + esc(a[5]) + "</span>" : "") + "</td><td>" + person(a[2], a[0]) + "</td><td>" + person(a[3]) + "</td>" + dateCell(a[4]) + '<td class="col-act"><button class="btn" type="button" data-open="' + k + '" aria-label="View ' + esc(a[1]) + " appointment, " + esc(shortDate(a[4])) + '">View</button></td></tr>'; }).join("") +
        '</tbody></table></div><ul class="cards">' +
        p.rows.map(function (a, i) { var k = S.tab + ":" + (p.start + i); return '<li><div class="card"><div class="card__main"><span class="card__date">' + dt(a[4]) + '</span><span class="card__title">' + esc(a[1]) + '</span><span class="card__person">' + person(a[2], a[0]) + "</span>" + (S.tab === "cancellations" ? '<span class="card__fact">' + esc(a[5]) + "</span>" : "") + "</div>" + CHEV + '<button class="card__open" type="button" data-open="' + k + '" aria-label="View ' + esc(a[1]) + " appointment, " + esc(shortDate(a[4])) + '"></button></div></li>'; }).join("") + "</ul>";
    }

  }
  function foot(key, p, hide) {

    var id = key + "-rpp", pages = "";

      pages = '<button type="button" data-page="' + key + ':prev" aria-label="Previous page"' + (S.page[key] === 1 ? " disabled" : "") + ">" + CHEV_L + "</button>";
      for (var i = 1; i <= p.pages; i++) {
        if (p.pages > 7 && i > 2 && i < p.pages - 1 && Math.abs(i - S.page[key]) > 1) { if (pages.slice(-7) !== "</span>") pages += '<span class="gap">&hellip;</span>'; continue; }
        pages += '<button type="button" data-page="' + key + ":" + i + '"' + (i === S.page[key] ? ' aria-current="page"' : "") + ">" + i + "</button>";
      }
      pages += '<button type="button" data-page="' + key + ':next" aria-label="Next page"' + (S.page[key] === p.pages ? " disabled" : "") + ">" + CHEV + "</button>";
    }
    el.innerHTML = '<div class="rpp"><span id="' + id + '-label">Rows per page</span><button class="select" type="button" id="' + id + '" data-rpp-open="' + key + '" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="' + id + '-label ' + id + '"><span>' + S.rpp[key] + '</span>' + CHEV_D + '</button><ul class="listbox" role="listbox" aria-labelledby="' + id + '-label" hidden>' + [5, 10, 20].map(function (v) { return '<li role="none"><button type="button" role="option" data-rpp="' + key + ':' + v + '" aria-selected="' + (v === S.rpp[key]) + '"><span>' + v + '</span>' + CHECK + '</button></li>'; }).join("") + '</ul></div><div class="pager"><span class="range">' + (p.start + 1) + "–" + Math.min(p.start + S.rpp[key], p.total) + " of " + p.total + '</span><nav class="pages" aria-label="' + key + ' pages">' + pages + "</nav></div>";
  }
  function render() {
    var D = data(), err = S.state === "error";
    $("#page-error").hidden = !err;
    $$(".panel[id]").forEach(function (s) { s.hidden = err; });
    if (err) return;
    $("#notes-q").value = S.q;
    $("#notes-q").disabled = S.state === "loading"; $("#notes-search").classList.toggle("is-disabled", S.state === "loading");
    $("#notes-search").classList.toggle("has-value", !!S.q);
    renderNotes(D); renderActions(D); renderAppts(D);
  }

  // sheet
  var lastFocus = null;
  var FILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>';
  var DOWNLOAD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';
  var CHAT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>';
  function when(iso) { return esc(shortDate(iso)) + " · " + esc(time(iso)) + " PDT"; }
  function files(list) { return list && list.length ? '<section><h3 class="sec__label">Attachments</h3><div class="files">' + list.map(function (f) { return '<a class="attachment" href="#download" aria-label="Download ' + esc(f[0]) + '"><span class="attachment__media">' + FILE + '</span><span class="attachment__content"><span class="attachment__title">' + esc(f[0]) + '</span><span class="attachment__desc">' + esc(f[1]) + '</span></span><span class="attachment__action">' + DOWNLOAD + "</span></a>"; }).join("") + "</div></section>" : ""; }
  function pills(list) { return '<ul class="pills">' + list.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>"; }
  function sec(label, html) { return '<section><h3 class="sec__label">' + label + "</h3>" + html + "</section>"; }
  function details(rows) { return '<section><h3 class="sec__label">Details</h3><dl class="dl">' + rows.filter(Boolean).map(function (r) { return "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>"; }).join("") + "</dl></section>"; }
  function openSheet(key, mode) {
    var k = key.split(":"), i = +k[1], D = data(), title, sub, body, who, det = "";
    if (k[0] === "notes") {
      var n = sorted("notes", filtered(D.notes))[i];
      title = n[1]; sub = '<span class="badge">' + esc(n[0]) + "</span>"; who = n[2];
      body = sec("Note", '<p class="sheet__text">' + esc(n[5]) + "</p>") + files(n[7]);
        det = details([["Created by", person(n[2], n[3])], ["Created on", when(n[4])], n[6] && n[6].length ? ["Topics", pills(n[6])] : null]);
    } else {
      var a = sorted("appts", D.appts[k[0]])[i];
      title = a[1]; who = a[2];
      sub = '<span class="badge ' + { summaries: "badge--success", noshows: "badge--neutral", cancellations: "badge--neutral" }[k[0]] + '">' + { summaries: "Completed", noshows: "No show", cancellations: "Cancelled" }[k[0]] + '</span><span class="sheet__dept">' + esc(a[0]) + "</span>";
      body = (a[5] ? sec({ summaries: "Summary", noshows: "Note", cancellations: "Cancellation reason" }[k[0]], '<p class="sheet__text">' + esc(a[5]) + "</p>") : '<p class="sheet__none">' + esc(a[2].split(" ")[0]) + " didn't add a note.</p>") + files(a[8]) +
        (a[6] ? sec("Reason for visit", '<p class="sheet__text">' + esc(a[6]) + "</p>") : "");
        det = details([["Type", esc(a[1])], ["With", person(a[2])], ["Booked by", person(a[3])], ["Created on", when(a[4])], a[7] && a[7].length ? ["Topics", pills(a[7])] : null]);
    }
    if (mode === "loading") body = '<div class="sheet-sk" aria-busy="true" aria-label="Loading">' + new Array(7).join('<span class="sk"></span>') + "</div>";
    if (mode === "notfound") body = '<div class="state state--error"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg><h3>This ' + (k[0] === "notes" ? "note" : "appointment") + ' isn\'t available</h3><p>The link may be out of date, or it may belong to another student. Your own notes and appointments are listed on this page.</p></div>';
    if (mode === "error") body = '<div class="state state--error"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg><h3>We couldn\'t open this ' + (k[0] === "notes" ? "note" : "appointment") + '</h3><p>Something went wrong on our side. Try again in a moment.</p><button class="btn btn--secondary" type="button" id="sheet-retry" data-retry="' + key + '">Try again</button></div>';
    $("#sheet-title").textContent = title; $("#sheet-sub").innerHTML = sub; $("#sheet-body").innerHTML = body; $("#sheet-details").innerHTML = mode ? "" : det; $("#sheet-body").scrollTop = 0;
    $("#sheet-msg").innerHTML = CHAT + "Message advisor"; $("#sheet-msg").setAttribute("aria-label", "Message " + who);
    $("#sheet-msg").hidden = false; $("#copy-link").hidden = k[0] !== "notes"; $("#book-again").hidden = k[0] === "notes";
    $("#sheet-foot").hidden = !!mode;
    if (!$("#sheet").classList.contains("is-open")) lastFocus = document.activeElement;
    $("#sheet").classList.add("is-open"); $("#sheet").setAttribute("aria-hidden", "false"); document.documentElement.classList.add("sheet-open");
    $(".sheet__close").focus();
  }
  function closeSheet() {
    $("#sheet").classList.remove("is-open"); $("#sheet").setAttribute("aria-hidden", "true"); document.documentElement.classList.remove("sheet-open");
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-sort],[data-open],[data-page],[data-close],[data-tab],.toggle,.clear,[data-state],#retry,[data-retry],#copy-link");
    if (e.target.closest('a[href="#message-center"], a[href="#download"]')) e.preventDefault();
    if (!t) return;
    if (t.dataset.state) { setState(t.dataset.state); return; }
    if (t.id === "retry") { setState("loading"); setTimeout(function () { setState("default"); }, 1200); return; }
    if (t.dataset.retry) { var rk = t.dataset.retry; openSheet(rk, "loading"); setTimeout(function () { openSheet(rk); }, 900); return; }
    if (t.dataset.open) { openSheet(t.dataset.open); return; }
    if (t.hasAttribute("data-close")) { closeSheet(); return; }
    if (t.id === "copy-link") { toast("Link copied"); return; }
    if (t.dataset.sort) { var sk = t.dataset.sort.split(":"), cur = S.sort[sk[0]]; S.sort[sk[0]] = cur[0] === sk[1] ? [sk[1], cur[1] === "asc" ? "desc" : "asc"] : [sk[1], /date|created/.test(sk[1]) ? "desc" : "asc"]; S.page[sk[0]] = 1; render(); var nb = $('[data-sort="' + t.dataset.sort + '"]'); if (nb) nb.focus(); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; S.page.appts = 1; $$(".tab").forEach(function (b) { b.setAttribute("aria-selected", b === t); }); t.scrollIntoView({ block: "nearest", inline: "nearest" }); renderAppts(data()); return; }
    if (t.dataset.page) { var p = t.dataset.page.split(":"); S.page[p[0]] = p[1] === "prev" ? S.page[p[0]] - 1 : p[1] === "next" ? S.page[p[0]] + 1 : +p[1]; render(); return; }
    if (t.classList.contains("toggle")) { var open = t.getAttribute("aria-expanded") === "true"; t.setAttribute("aria-expanded", !open); t.closest(".panel").classList.toggle("is-collapsed", open); return; }
    if (t.classList.contains("clear")) { S.q = ""; S.page.notes = 1; render(); $("#notes-q").focus(); }
  });
  document.addEventListener("click", function (e) {

    if (o) { var lb = o.nextElementSibling, open = lb.hidden; lb.hidden = !open; o.setAttribute("aria-expanded", open); if (open) lb.querySelector('[aria-selected="true"]').focus(); }
    if (opt) { var v = opt.dataset.rpp.split(":"); S.rpp[v[0]] = +v[1]; S.page[v[0]] = 1; render(); $("#" + v[0] + "-rpp").focus(); }
  });
  $("#notes-q").addEventListener("input", function (e) { S.q = e.target.value; S.page.notes = 1; $("#notes-search").classList.toggle("has-value", !!S.q); renderNotes(data()); });
  document.addEventListener("keydown", function (e) { if (e.key !== "Escape") return; var lb = $(".listbox:not([hidden])"); if (lb) { lb.hidden = true; lb.previousElementSibling.setAttribute("aria-expanded", "false"); lb.previousElementSibling.focus(); return; } if ($("#sheet").classList.contains("is-open")) closeSheet(); });

  function toast(msg, stay) { var to = $("#toast"); to.textContent = msg; to.classList.add("is-on"); clearTimeout(to._t); if (!stay) to._t = setTimeout(function () { to.classList.remove("is-on"); }, 2000); }
  function setState(s) {

    S.q = s === "nosearch" ? "scholarship" : "";
    S.page = { notes: 1, actions: 1, appts: 1 };
    S.sort = { notes: ["date", "desc"], actions: ["date", "desc"], appts: ["created", "desc"] };

    if (s === "sheetnoact") { openSheet("cancellations:2"); $("#book-again").hidden = true; $("#sheet-msg").hidden = true; $("#sheet-foot").hidden = true; }

  }
  var tabs = $(".tabs");
  function tabsEnd() { tabs.classList.toggle("is-end", tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 1); }
  tabs.addEventListener("scroll", tabsEnd); window.addEventListener("resize", tabsEnd);
  render(); tabsEnd();
})();
</script>
<!-- mockup-only: opens the Preferences menu, do not build -->
<script>
(function () {
  var b = document.getElementById("prefs-btn"), m = document.getElementById("prefs-menu");
  function close(back) { m.hidden = true; b.setAttribute("aria-expanded", "false"); if (back) b.focus(); }
  b.addEventListener("click", function (e) { e.stopPropagation(); if (m.hidden) { m.hidden = false; b.setAttribute("aria-expanded", "true"); m.querySelector("a").focus(); } else close(true); });
  m.addEventListener("click", function (e) { if (e.target.closest("a")) { e.preventDefault(); close(true); } });
  document.addEventListener("click", function (e) { if (!m.hidden && !e.target.closest(".prefs")) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !m.hidden) close(true); });
