<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
PAGE: History
FOR: student (signed in; sees only their own records)
PURPOSE: Lets a student look back at what their advisors recorded about them (notes, action items, past appointments) and open any note or appointment in full.
URL: ?q=<text> (Notes search), ?tab=summaries|noshows|cancellations (selected Appointments tab), ?note=<id> / ?appointment=<id> (the open record — what Copy link copies). Page numbers and rows per page are not kept in the URL.
DATA:
  - Notes: category, subject, author name + department, created date/time; the full note text is read when a note is opened. Source: not known yet.
  - Action items: type, author name + department, created date/time, comment (full text, shown in the list). Source: not known yet.
  - Appointments: past appointments in three groups (Summaries, No Shows, Cancellations): department, appointment type, department member, created by, created on; the summary / no-show / cancellation text is read when an appointment is opened. Source: not known yet.
  - Each list comes with its total count (shown next to the section title and on each tab).
ACTIONS:
  - Search notes by text.
  - Collapse / expand each section.
  - Switch the Appointments tab (Summaries, No Shows, Cancellations).
  - Change rows per page (5, 10, 20) and page through each list on its own.
  - Open a note or an appointment: a Sheet (side panel) on this page shows the full record. Action items are not opened; the list shows the whole comment.
  - Nothing on this page saves or sends anything.
OPEN QUESTIONS:
  1. Does ui-next Table have a stacked layout for phone width? Below 760px this mockup shows each row as a card; if Table can't, which component should the cards be?
  2. Is the collapsed / expanded state of a section remembered between visits?
  3. What does Notes search match: subject, category, author, the note text?
STATES NOT SHOWN: "Error saving" (nothing on this page saves). "One section failed" (not needed for now; if one list fails the whole page shows Error).
-->
<!--
STATES (switcher order):
  Default: normal data.
  Loading: first load; every list shows skeleton rows, counts show "–", pagination hidden.
  Empty: a new student with no records; each section stays and shows its own EmptyState.
  No search results: Notes search matched nothing; the other sections are unaffected.
  Error: the history couldn't load; one ErrorState replaces the three sections.
  Many rows: long lists in every section (56 notes, 32 action items, 41 summaries) with long titles, names and departments; pagination shortens with "…".
  Record open: the Sheet for the first note.
  Record loading: the Sheet while the full record is being read.
  Record error: the Sheet when the full record couldn't be read.
-->
<!-- rule (all three lists): while loading → LoadingState with SkeletonLine rows; no records → EmptyState with a sentence specific to that list -->
<!-- ui-next: LoadingState | wraps the skeleton rows, aria-busy -->
<!-- ui-next: SkeletonLine | 3 rows per list while loading -->
<!-- ui-next: EmptyState | per section: one short line of text on a grey pill, centred; no icon, no heading. Texts: "No notes yet", "No notes match “<search text>”", "No action items", "No appointment summaries", "No missed appointments", "No cancelled appointments" -->

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>History — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Mockup styling only — developers use ui-next components, not this CSS.
   Values are copied from the HighPoint design system (hp-design tokens, History v4 page), not new ones. */
:root {
  --page: #f9fafb; --surface: #ffffff; --surface-dim: #f4f5f7; --surface-dim-hover: #e6e8eb; --sunken: #e6e8eb;
  --border: #dadde0; --border-strong: #adb5be; --text: #121921; --text-2: #5d6a7a; --text-muted: #758191; --text-disabled: #adb5be;
  --icon: #485462; --icon-2: #758191; --primary: #077fec; --primary-hover: #0468c4; --primary-text: #0468c4;
  --primary-tint: #d9eaff; --primary-tint-hover: #c7dffc; --focus: #0468c4;
  --neutral-hover: #e6e8eb; --counter-bg: #cdd1d6; --counter-text: #485462;
  --amber-bg: #ffe2c5; --amber-text: #935a03; --amber-50: #fff3e7;
  --danger-bg: #ffdfde; --danger-border: #febebd; --danger-text: #c11435;
  --overlay: rgba(21, 25, 30, 0.5); --radius: 8px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { font-family: "Sora", system-ui, sans-serif; font-size: 14px; line-height: 1.4; color: var(--text); background: var(--page); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; }

/* mockup-only state switcher */
.mk { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; background: #242c36; color: #fff; font-size: 12px; line-height: 16px; }
.mk b { margin-right: 4px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #d9eaff; }
.mk button { padding: 4px 12px; border: 1px solid #485462; border-radius: 999px; background: transparent; color: #fff; font-size: 12px; cursor: pointer; }
.mk button[aria-pressed="true"] { background: #fff; color: #121921; border-color: #fff; }

/* TopBar */
.topbar { display: flex; align-items: center; height: 64px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
.topbar h1 { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 600; }
.wrap { container-type: inline-size; max-width: 1280px; margin: 0 auto; padding: 32px 32px 48px; display: flex; flex-direction: column; gap: 24px; }

/* CollapsiblePanel (flush Card) */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.panel__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); }
.panel--tabs .panel__head { border-bottom: none; padding-bottom: 8px; }
.panel.is-collapsed .panel__head { border-bottom: none; padding-bottom: 16px; }
.panel.is-collapsed .panel__body, .panel.is-collapsed .field-inline { display: none; }
.panel__title { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 4px; font-weight: 600; }
.toggle svg { color: var(--icon-2); transition: transform .15s; }
.toggle:hover svg { color: var(--icon); }
.toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
/* CountBadge (DS Counter) */
.count { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--counter-bg); color: var(--counter-text); font-size: 10px; line-height: 1; font-weight: 700; }

/* Field with inline label + SearchField (DS Search sm) */
.field-inline { display: flex; align-items: center; gap: 8px; }
.field-inline label { font-size: 14px; color: var(--text-2); white-space: nowrap; }
.search { display: flex; align-items: center; gap: 8px; width: 280px; max-width: 100%; height: 32px; padding: 0 12px; background: var(--surface-dim); border: 1px solid var(--border); border-radius: var(--radius); }
.search:hover { background: var(--surface-dim-hover); border-color: var(--border-strong); }
.search:focus-within { border-color: var(--focus); }
.search__icon { color: var(--icon); }
.search input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: var(--text); }
.search input::placeholder { color: var(--text-muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { display: none; width: 20px; height: 20px; padding: 0; border: 0; background: none; color: var(--icon); cursor: pointer; border-radius: var(--radius); }
.search.has-value .clear { display: inline-flex; }

/* Tabs (underline) */
.tabs { display: flex; padding: 0 16px 0 32px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 2px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--text-2); font-size: 14px; font-weight: 400; white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--text); }
.tabs:not(.is-end) { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.tab[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--primary); }
.tab[aria-selected="true"] .count { background: var(--primary); color: #fff; }

/* Table */
table { width: 100%; border-collapse: collapse; }
th { padding: 12px 16px; text-align: left; font-size: 12px; line-height: 1.4; font-weight: 700; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px 16px; vertical-align: top; border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-dim); }
th + th, td + td { padding-left: 16px; }
.t-title { font-size: 14px; line-height: 1.4; font-weight: 600; }
.sub { display: block; color: var(--text-2); }
.date { white-space: nowrap; color: var(--text-2); }
.date .sub { color: var(--text-2); }
.col-act { width: 72px; text-align: right; }
.person { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 280px; }
.person__text { display: flex; flex-direction: column; min-width: 0; }
.person__name, .person__sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person__sub { color: var(--text-muted); }
.avatar { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; font-size: 12px; line-height: 1; font-weight: 600; user-select: none; }
.avatar--blue { background: #d9eaff; color: #0468c4; } .avatar--green { background: #d4f1da; color: #057e3f; }
.avatar--magenta { background: #ffddec; color: #b51c79; } .avatar--amber { background: #ffe2c5; color: #935a03; }
.avatar--teal { background: #cfefef; color: #057878; } .avatar--orange { background: #ffe1d5; color: #ae4103; }
.avatar--violet { background: #e8e4ff; color: #743ed8; } .avatar--red { background: #ffdfde; color: #c11435; }
.fact { display: flex; gap: 8px; color: var(--text-2); }
.fact svg { width: 16px; height: 16px; margin-top: 2px; color: var(--icon-2); }
.fact span span { display: block; }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--amber-bg); color: var(--amber-text); font-size: 12px; line-height: 1; font-weight: 400; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: var(--radius); background: var(--primary-tint); color: var(--primary-text); font-size: 12px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--primary-tint-hover); }
.btn--primary { background: var(--primary); color: #fff; height: 40px; padding: 0 16px; font-size: 14px; }
.btn--primary:hover { background: var(--primary-hover); }
.clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.reason { display: block; margin-top: 4px; color: var(--text-2); }

/* Phone cards (below 760px) */
.cards { display: none; list-style: none; margin: 0; padding: 0; }
.card { position: relative; display: flex; gap: 12px; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
.cards li:last-child .card { border-bottom: none; }
.card__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.card__date { font-size: 12px; line-height: 1.4; color: var(--text-2); }
.card__title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; line-height: 1.4; font-weight: 600; }
.card__person { margin-top: 4px; font-size: 12px; line-height: 1.4; }
.card__person .person { max-width: 100%; }
.card__person .person__name { color: var(--text); }
.card__fact { font-size: 12px; line-height: 1.4; color: var(--text-2); }
.card__comment { padding: 8px 12px; border-radius: var(--radius); background: var(--amber-50); }
.card > svg { color: var(--icon-2); }
.card__open { position: absolute; inset: 0; border: 0; background: none; cursor: pointer; border-radius: 0; }
.card__open:focus-visible { outline-offset: -2px; }
.card:has(.card__open):hover { background: var(--surface-dim); }

/* TablePaginationControl (DS rows-per-page Select sm + Pagination) */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 12px 16px; border-top: 1px solid var(--border); }
.rpp { position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.select { display: flex; align-items: center; gap: 8px; width: 72px; height: 32px; padding: 0 8px; background: var(--surface-dim); border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; color: var(--text); text-align: left; cursor: pointer; }
.select:hover { background: var(--surface-dim-hover); border-color: var(--border-strong); }
.select:focus-visible { outline: none; border-color: var(--focus); }
.select[aria-expanded="true"] { border-color: var(--focus); }
.select span { flex: 1; }
.select svg { width: 16px; height: 16px; color: var(--icon); transition: transform .12s; }
.select[aria-expanded="true"] svg { transform: rotate(180deg); }
.listbox { position: absolute; bottom: calc(100% + 4px); right: 0; z-index: 20; min-width: 72px; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 2px 8px rgba(21, 25, 30, 0.1); }
.listbox button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px; border: 0; border-radius: 4px; background: none; font-size: 14px; color: var(--text); cursor: pointer; text-align: left; }
.listbox button:hover { background: var(--neutral-hover); }
.listbox svg { width: 16px; height: 16px; color: var(--primary); visibility: hidden; }
.listbox [aria-selected="true"] svg { visibility: visible; }
.pager { display: flex; align-items: center; gap: 12px; }
.range { font-size: 12px; color: var(--text-muted); }
.pages { display: inline-flex; align-items: center; gap: 4px; }
.pages button { min-width: 32px; height: 32px; padding: 0 6px; border: 0; border-radius: var(--radius); background: none; font-size: 14px; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.pages button svg { width: 20px; height: 20px; }
.pages button:hover:not(:disabled):not([aria-current]) { background: var(--neutral-hover); }
.pages button[aria-current="page"] { background: var(--primary); color: #fff; }
.pages button:disabled { color: var(--text-disabled); cursor: default; }
.pages .gap { min-width: 24px; text-align: center; color: var(--text-muted); }

/* EmptyState (DS: text on a long grey pill) */
.empty { display: flex; justify-content: center; padding: 24px; }
.empty__text { padding: 8px 16px; border-radius: 999px; background: #e6e8eb; color: var(--text-2); font-size: 14px; line-height: 1.4; text-align: center; }
/* ErrorState / LoadingState */
.state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 16px; text-align: center; }
.state svg { width: 32px; height: 32px; color: var(--icon-2); }
.state h2, .state h3 { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; }
.state p { margin: 0; color: var(--text-2); max-width: 400px; }
.state .btn { margin-top: 8px; }
.state--error svg { color: var(--danger-text); }
.btn--secondary { height: 40px; padding: 0 16px; font-size: 14px; }
.sheet-sk { display: flex; flex-direction: column; gap: 12px; }
.sheet-sk .sk:nth-child(3n) { width: 60%; }
.sk { display: block; height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--sunken) 0%, var(--surface-dim) 50%, var(--sunken) 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } .toggle svg, .select svg { transition: none; } }
.sk-row { display: grid; grid-template-columns: 1fr 2fr 1fr 1.5fr; gap: 16px; padding: 18px 16px; border-bottom: 1px solid var(--border); }

/* Sheet (right side panel) */
.sheet { position: fixed; inset: 0; z-index: 40; display: none; }
.sheet.is-open { display: block; }
.sheet__scrim { position: absolute; inset: 0; background: var(--overlay); }
.sheet__panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 100%); display: flex; flex-direction: column; background: var(--surface); box-shadow: -8px 0 24px rgba(0,0,0,.12); }
.sheet__head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.sheet__heading { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.sheet__head h2 { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 600; }
.sheet__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; font-size: 12px; line-height: 1.4; color: var(--text-muted); }
.badge--neutral { background: #e6e8eb; color: var(--text-2); }
.sheet__close { padding: 6px; border: 0; background: none; border-radius: var(--radius); color: var(--icon); cursor: pointer; display: inline-flex; }
.sheet__close:hover { background: var(--neutral-hover); }
.sheet__body { padding: 24px; overflow-y: auto; }
.sheet__text { white-space: pre-line; }
.byline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
.byline .person { max-width: 100%; }
.byline__booked { flex-basis: 100%; margin-top: -4px; font-size: 12px; line-height: 1.4; color: var(--text-muted); }
.files { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.attachment { display: flex; align-items: center; gap: 8px; max-width: 320px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-dim); color: inherit; text-decoration: none; }
.attachment:hover { border-color: var(--primary); }
.attachment__media { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--radius); background: var(--surface); }
.attachment__media svg { color: var(--icon-2); }
.attachment__content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.attachment__title, .attachment__desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment__title { font-size: 12px; line-height: 1.2; font-weight: 600; }
.attachment__desc { font-size: 10px; line-height: 1.2; color: var(--text-muted); }
.attachment__action { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--radius); color: var(--icon-2); }
.attachment__action svg { width: 16px; height: 16px; }
.attachment:hover .attachment__action { background: var(--neutral-hover); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.pills li { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; background: #e6e8eb; color: var(--text-2); font-size: 12px; }
.btn svg { width: 16px; height: 16px; }
a.btn { text-decoration: none; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translateX(-50%); padding: 12px 16px; border-radius: var(--radius); background: #242c36; color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .15s; }
.toast.is-on { opacity: 1; }
.sheet__body h3 { margin: 0 0 8px; font-size: 14px; line-height: 1.4; font-weight: 600; }
.sheet__body p { margin: 0; }

/* Phone / narrow */
@container (min-width: 560px) and (max-width: 759px) {
  .card__main { display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 16px; row-gap: 4px; align-items: start; }
  .card__main > * { grid-column: 2; }
  .card__main > .card__date { grid-column: 1; grid-row: 1 / span 4; display: flex; flex-direction: column; font-size: 14px; }
  .card__sep { display: none; }
}
@container (max-width: 759px) {
  .tablewrap { display: none; }
  .cards { display: block; }
  .sk-row { grid-template-columns: 1fr; gap: 8px; }
}
@media (max-width: 759px) {
  .topbar { padding: 0 16px; }
  .wrap { padding: 16px 0; gap: 16px; }
  .panel { border-left: 0; border-right: 0; border-radius: 0; }
  .field-inline { width: 100%; }
  .search { width: 100%; }
  .tabs { padding-left: 16px; }
  .foot { justify-content: center; }
}
</style>
</head>
<body>

<!-- mockup-only: state switcher, do not build -->
<div class="mk" role="toolbar" aria-label="Mockup states">
  <b>Mockup state</b>
  <button type="button" data-state="default" aria-pressed="true">Default</button>
  <button type="button" data-state="loading" aria-pressed="false">Loading</button>
  <button type="button" data-state="empty" aria-pressed="false">Empty</button>
  <button type="button" data-state="nosearch" aria-pressed="false">No search results</button>
  <button type="button" data-state="error" aria-pressed="false">Error</button>
  <button type="button" data-state="many" aria-pressed="false">Many rows</button>
  <button type="button" data-state="sheet" aria-pressed="false">Record open</button>
  <button type="button" data-state="sheetload" aria-pressed="false">Record loading</button>
  <button type="button" data-state="sheeterr" aria-pressed="false">Record error</button>
</div>

<!-- ui-next: TopBar -->
<!-- data: page title only -->
<header class="topbar">
  <!-- ui-next: Text | as="h1" -->
  <h1>History</h1>
</header>

<main class="wrap" id="main">

  <!-- ui-next: ErrorState -->
  <!-- state: "Error": the history couldn't load. Replaces all three sections. -->
  <!-- action: "Try again" re-requests all three lists and shows the Loading state while it waits -->
  <div id="page-error" hidden>
    <div class="panel"><div class="state state--error">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg>
      <!-- ui-next: Text | as="h2" -->
      <h2>We couldn't load your history</h2>
      <p>Something went wrong on our side. Your records are safe — try again in a moment.</p>

  function avatar(name) { var ini = name.split(/[\s-]+/).map(function (w) { return w[0]; }).slice(0, 2).join(""); return '<span class="avatar avatar--' + HUES[hash(name) % HUES.length] + '" aria-hidden="true">' + esc(ini) + "</span>"; }
  function person(name, dept) { return '<span class="person">' + avatar(name) + '<span class="person__text"><span class="person__name">' + esc(name) + "</span>" + (dept ? '<span class="person__sub" title="' + esc(dept) + '">' + esc(dept) + "</span>" : "") + "</span></span>"; }
  function dt(iso) { return "<span>" + esc(shortDate(iso)) + '</span><span class="card__sep"> · </span><span>' + esc(time(iso)) + "</span>"; }
  function dateCell(iso) { return '<td class="date">' + esc(longDate(iso)) + '<span class="sub">' + esc(time(iso)) + "</span></td>"; }

  function emptyState(text) { return '<div class="empty"><span class="empty__text">' + esc(text) + "</span></div>"; }
  function skeleton() { var r = ""; for (var i = 0; i < 3; i++) r += '<div class="sk-row"><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>'; return '<div aria-busy="true" aria-label="Loading">' + r + "</div>"; }

  function renderNotes(D) {
    var list = filtered(D.notes), p = slice("notes", list), html;
    if (S.state === "loading") html = skeleton();
    else if (!D.notes.length) html = emptyState("No notes yet");
    else if (!list.length) html = emptyState("No notes match “" + S.q.trim() + "”");
    else {
      html = '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Subject</th><th>Category</th><th>Created by</th><th class="col-act"><span class="vh">Actions</span></th></tr></thead><tbody>' +
        p.rows.map(function (n, i) { var k = "notes:" + (p.start + i); return "<tr>" + dateCell(n[4]) + '<td class="t-title"><span class="clamp2">' + esc(n[1]) + '</span></td><td><span class="badge">' + esc(n[0]) + "</span></td><td>" + person(n[2], n[3]) + '</td><td class="col-act"><button class="btn" type="button" data-open="' + k + '" aria-label="View note: ' + esc(n[1]) + '">View</button></td></tr>'; }).join("") +
        '</tbody></table></div><ul class="cards">' +
        p.rows.map(function (n, i) { var k = "notes:" + (p.start + i); return '<li><div class="card"><div class="card__main"><span class="card__date">' + dt(n[4]) + '</span><span class="card__title"><span class="clamp2">' + esc(n[1]) + '</span> <span class="badge">' + esc(n[0]) + '</span></span><span class="card__person">' + person(n[2], n[3]) + '</span></div>' + CHEV + '<button class="card__open" type="button" data-open="' + k + '" aria-label="View note: ' + esc(n[1]) + '"></button></div></li>'; }).join("") + "</ul>";
    }
    $('[data-list="notes"]').innerHTML = html;
    $('[data-count="notes"]').textContent = S.state === "loading" ? "–" : D.notes.length;
    foot("notes", p, S.state === "loading" || !list.length);
  }
  function renderActions(D) {
    var p = slice("actions", D.actions), html;
    if (S.state === "loading") html = skeleton();
    else if (!D.actions.length) html = emptyState("No action items");
    else {
      html = '<div class="tablewrap"><table><colgroup><col style="width:232px"><col style="width:200px"><col style="width:240px"><col></colgroup><thead><tr><th>Date</th><th>Type</th><th>Created by</th><th>Comment</th></tr></thead><tbody>' +
        p.rows.map(function (a) { return "<tr>" + dateCell(a[3]) + '<td class="t-title">' + esc(a[0]) + "</td><td>" + person(a[2], a[1]) + "</td><td>" + esc(a[4]) + "</td></tr>"; }).join("") +
        '</tbody></table></div><ul class="cards">' +
        p.rows.map(function (a) { return '<li><div class="card"><div class="card__main"><span class="card__date">' + dt(a[3]) + '</span><span class="card__title">' + esc(a[0]) + '</span><span class="card__person">' + person(a[2], a[1]) + '</span><span class="card__comment">' + esc(a[4]) + "</span></div></div></li>"; }).join("") + "</ul>";
    }
    $('[data-list="actions"]').innerHTML = html;
    var c = $('[data-count="actions"]'); c.textContent = S.state === "loading" ? "–" : D.actions.length; 
    foot("actions", p, S.state === "loading" || !D.actions.length);
  }
  function renderAppts(D) {
    var list = D.appts[S.tab], p = slice("appts", list), html, total = 0;
    ["summaries", "noshows", "cancellations"].forEach(function (t) { total += D.appts[t].length; $('[data-count="' + t + '"]').textContent = S.state === "loading" ? "–" : D.appts[t].length; });
    $('[data-count="appts"]').textContent = S.state === "loading" ? "–" : total;
    var EMPTY = { summaries: ["No appointment summaries", "After you meet with an advisor, the summary of the meeting shows up here."], noshows: ["No missed appointments", "You haven't missed any appointments."], cancellations: ["No cancelled appointments", "You have no cancelled appointments."] }[S.tab];
    if (S.state === "loading") html = skeleton();
    else if (!list.length) html = emptyState(EMPTY[0]);
    else {
      html = '<div class="tablewrap"><table><thead><tr><th>Department</th><th>Type</th><th>Department member</th><th>Created by</th><th>Created on</th><th class="col-act"><span class="vh">Actions</span></th></tr></thead><tbody>' +
        p.rows.map(function (a, i) { var k = S.tab + ":" + (p.start + i); return "<tr><td>" + esc(a[0]) + '</td><td><span class="t-title">' + esc(a[1]) + "</span>" + (S.tab === "cancellations" ? '<span class="reason">' + esc(a[5]) + "</span>" : "") + "</td><td>" + person(a[2]) + "</td><td>" + person(a[3]) + "</td>" + dateCell(a[4]) + '<td class="col-act"><button class="btn" type="button" data-open="' + k + '" aria-label="View ' + esc(a[1]) + " appointment, " + esc(shortDate(a[4])) + '">View</button></td></tr>'; }).join("") +
        '</tbody></table></div><ul class="cards">' +
        p.rows.map(function (a, i) { var k = S.tab + ":" + (p.start + i); return '<li><div class="card"><div class="card__main"><span class="card__date">' + dt(a[4]) + '</span><span class="card__title">' + esc(a[1]) + '</span><span class="card__person">' + person(a[2], a[0]) + "</span>" + (S.tab === "cancellations" ? '<span class="card__fact">' + esc(a[5]) + "</span>" : "") + "</div>" + CHEV + '<button class="card__open" type="button" data-open="' + k + '" aria-label="View ' + esc(a[1]) + " appointment, " + esc(shortDate(a[4])) + '"></button></div></li>'; }).join("") + "</ul>";
    }
    $('[data-list="appts"]').innerHTML = html;
    foot("appts", p, S.state === "loading" || !list.length);
  }
  function foot(key, p, hide) {
    var el = $('[data-foot="' + key + '"]');
    el.hidden = hide;
    if (hide) return;
    var id = key + "-rpp", pages = "";
    if (p.pages > 1) {
      pages = '<button type="button" data-page="' + key + ':prev" aria-label="Previous page"' + (S.page[key] === 1 ? " disabled" : "") + ">" + CHEV_L + "</button>";
      for (var i = 1; i <= p.pages; i++) {
        if (p.pages > 7 && i > 2 && i < p.pages - 1 && Math.abs(i - S.page[key]) > 1) { if (pages.slice(-7) !== "</span>") pages += '<span class="gap">&hellip;</span>'; continue; }
        pages += '<button type="button" data-page="' + key + ":" + i + '"' + (i === S.page[key] ? ' aria-current="page"' : "") + ">" + i + "</button>";
      }
      pages += '<button type="button" data-page="' + key + ':next" aria-label="Next page"' + (S.page[key] === p.pages ? " disabled" : "") + ">" + CHEV + "</button>";
    }
    el.innerHTML = '<div class="rpp"><span id="' + id + '-label">Rows per page</span><button class="select" type="button" id="' + id + '" data-rpp-open="' + key + '" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="' + id + '-label ' + id + '"><span>' + S.rpp[key] + '</span>' + CHEV_D + '</button><ul class="listbox" role="listbox" aria-labelledby="' + id + '-label" hidden>' + [5, 10, 20].map(function (v) { return '<li role="none"><button type="button" role="option" data-rpp="' + key + ':' + v + '" aria-selected="' + (v === S.rpp[key]) + '"><span>' + v + '</span>' + CHECK + '</button></li>'; }).join("") + '</ul></div><div class="pager"><span class="range">' + (p.start + 1) + "–" + Math.min(p.start + S.rpp[key], p.total) + " of " + p.total + '</span><nav class="pages" aria-label="' + key + ' pages">' + pages + "</nav></div>";
  }
  function render() {
    var D = data(), err = S.state === "error";
    $("#page-error").hidden = !err;
    $$(".panel[id]").forEach(function (s) { s.hidden = err; });
    if (err) return;
    $("#notes-q").value = S.q;
    $("#notes-search").classList.toggle("has-value", !!S.q);
    renderNotes(D); renderActions(D); renderAppts(D);
  }

  // sheet
  var lastFocus = null;
  var FILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>';
  var DOWNLOAD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';
  var CHAT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>';
  function when(iso) { return esc(shortDate(iso)) + " · " + esc(time(iso)) + " PDT"; }
  function byline(name, dept, booked) { return '<div class="byline">' + person(name, dept) + '<a class="btn" href="#message-center">' + CHAT + "Message " + esc(name.split(" ")[0]) + "</a>" + (booked && booked !== name ? '<span class="byline__booked">Booked by ' + esc(booked) + "</span>" : "") + "</div>"; }
  function files(list) { return list && list.length ? '<div class="files">' + list.map(function (f) { return '<a class="attachment" href="#download" aria-label="Download ' + esc(f[0]) + '"><span class="attachment__media">' + FILE + '</span><span class="attachment__content"><span class="attachment__title">' + esc(f[0]) + '</span><span class="attachment__desc">' + esc(f[1]) + '</span></span><span class="attachment__action">' + DOWNLOAD + "</span></a>"; }).join("") + "</div>" : ""; }
  function pills(list) { return list && list.length ? '<ul class="pills" aria-label="Topics">' + list.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>" : ""; }
  function openSheet(key, mode) {
    var k = key.split(":"), i = +k[1], D = data(), title, sub, body;
    if (k[0] === "notes") {
      var n = filtered(D.notes)[i];
      title = n[1]; sub = '<span class="badge">' + esc(n[0]) + "</span>" + when(n[4]);
      body = '<p class="sheet__text">' + esc(n[5]) + "</p>" + files(n[7]) + pills(n[6]) + byline(n[2], n[3]);
    } else {
      var a = D.appts[k[0]][i];
      title = a[1] + " appointment"; sub = '<span class="badge badge--neutral">' + { summaries: "Summary", noshows: "No show", cancellations: "Cancelled" }[k[0]] + "</span>" + when(a[4]);
      body = '<p class="sheet__text">' + esc(a[5]) + "</p>" + byline(a[2], a[0], a[3]);
    }
    if (mode === "loading") body = '<div class="sheet-sk" aria-busy="true" aria-label="Loading">' + new Array(7).join('<span class="sk"></span>') + "</div>";
    if (mode === "error") body = '<div class="state state--error"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg><h3>We couldn\'t open this ' + (k[0] === "notes" ? "note" : "appointment") + '</h3><p>Something went wrong on our side. Try again in a moment.</p><button class="btn btn--secondary" type="button" id="sheet-retry" data-retry="' + key + '">Try again</button></div>';
    $("#sheet-title").textContent = title; $("#sheet-sub").innerHTML = sub; $("#sheet-body").innerHTML = body;
    if (!$("#sheet").classList.contains("is-open")) lastFocus = document.activeElement;
    $("#sheet").classList.add("is-open"); $("#sheet").setAttribute("aria-hidden", "false");
    $(".sheet__close").focus();
  }
  function closeSheet() {
    $("#sheet").classList.remove("is-open"); $("#sheet").setAttribute("aria-hidden", "true");
    if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-open],[data-page],[data-close],[data-tab],.toggle,.clear,[data-state],#retry,[data-retry],#copy-link");
    if (e.target.closest('a[href="#message-center"], a[href="#download"]')) e.preventDefault();
    if (!t) return;
    if (t.dataset.state) { setState(t.dataset.state); return; }
    if (t.id === "retry") { setState("loading"); setTimeout(function () { setState("default"); }, 1200); return; }
    if (t.dataset.retry) { var rk = t.dataset.retry; openSheet(rk, "loading"); setTimeout(function () { openSheet(rk); }, 900); return; }
    if (t.dataset.open) { openSheet(t.dataset.open); return; }
    if (t.hasAttribute("data-close")) { closeSheet(); return; }
    if (t.id === "copy-link") { var to = $("#toast"); to.textContent = "Link copied"; to.classList.add("is-on"); clearTimeout(to._t); to._t = setTimeout(function () { to.classList.remove("is-on"); }, 2000); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; S.page.appts = 1; $$(".tab").forEach(function (b) { b.setAttribute("aria-selected", b === t); }); t.scrollIntoView({ block: "nearest", inline: "nearest" }); renderAppts(data()); return; }
    if (t.dataset.page) { var p = t.dataset.page.split(":"); S.page[p[0]] = p[1] === "prev" ? S.page[p[0]] - 1 : p[1] === "next" ? S.page[p[0]] + 1 : +p[1]; render(); return; }
    if (t.classList.contains("toggle")) { var open = t.getAttribute("aria-expanded") === "true"; t.setAttribute("aria-expanded", !open); t.closest(".panel").classList.toggle("is-collapsed", open); return; }
    if (t.classList.contains("clear")) { S.q = ""; S.page.notes = 1; render(); $("#notes-q").focus(); }
  });
  document.addEventListener("click", function (e) {
    var o = e.target.closest("[data-rpp-open]"), opt = e.target.closest("[data-rpp]");
    $$(".listbox").forEach(function (l) { if (!o || l.previousElementSibling !== o) { l.hidden = true; l.previousElementSibling.setAttribute("aria-expanded", "false"); } });
    if (o) { var lb = o.nextElementSibling, open = lb.hidden; lb.hidden = !open; o.setAttribute("aria-expanded", open); if (open) lb.querySelector('[aria-selected="true"]').focus(); }
    if (opt) { var v = opt.dataset.rpp.split(":"); S.rpp[v[0]] = +v[1]; S.page[v[0]] = 1; render(); $("#" + v[0] + "-rpp").focus(); }
  });
  $("#notes-q").addEventListener("input", function (e) { S.q = e.target.value; S.page.notes = 1; $("#notes-search").classList.toggle("has-value", !!S.q); renderNotes(data()); });
  document.addEventListener("keydown", function (e) { if (e.key !== "Escape") return; var lb = $(".listbox:not([hidden])"); if (lb) { lb.hidden = true; lb.previousElementSibling.setAttribute("aria-expanded", "false"); lb.previousElementSibling.focus(); return; } if ($("#sheet").classList.contains("is-open")) closeSheet(); });

  function setState(s) {
    S.state = /^(nosearch|sheet)/.test(s) ? "default" : s;
    S.q = s === "nosearch" ? "scholarship" : "";
    S.page = { notes: 1, actions: 1, appts: 1 };
    $$(".mk button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.state === s); });
    closeSheet();
    render();
    if (s === "sheet") openSheet("notes:0");
    if (s === "sheetload") openSheet("notes:0", "loading");
    if (s === "sheeterr") openSheet("notes:0", "error");
  }
  var tabs = $(".tabs");
  function tabsEnd() { tabs.classList.toggle("is-end", tabs.scrollLeft + tabs.clientWidth >= tabs.scrollWidth - 1); }
  tabs.addEventListener("scroll", tabsEnd); window.addEventListener("resize", tabsEnd);
  render(); tabsEnd();
})();
</script>
</body>
</html>
